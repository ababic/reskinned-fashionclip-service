openapi: 3.0.3
info:
  title: Reskinned FashionCLIP Scorer
  version: "1"
  description: |
    POST product image URLs with boolean classifier flags; receive ranked FashionCLIP
    scores from service-owned vocabularies.

    **Human-readable guide:** [`docs/api.md`](../docs/api.md) — `options`, optional
    catalog/style classifiers, and `score` / `gap` / `p`.

    Thresholding and promotion policy live in reskinned-inventory (`PRINT_VISION_*`).
    Classifier slugs are a closed taxonomy; each slug uses an aspect-specific CLIP caption.
  x-readme: docs/api.md
servers:
  - url: https://{apiId}.execute-api.eu-west-1.amazonaws.com/prod
    variables:
      apiId:
        default: example
paths:
  /v1/score:
    post:
      summary: Score images against enabled classifiers or warm the model
      description: |
        Score 1–2 garment images. Only classifiers set to `true` in `options` are
        scored. Each uses a service-owned vocabulary. See `docs/api.md`. Send
        `{"warmup": true}` to load the model without scoring.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ScoreRequest"
                - $ref: "#/components/schemas/WarmupRequest"
            examples:
              print_only:
                summary: Print facets (inventory today)
                value:
                  images:
                    - url: https://cdn.example.com/garment.jpg
                  options:
                    pattern-application: true
                    pattern: true
              with_colour:
                summary: Print + colour probe
                value:
                  images:
                    - url: https://cdn.example.com/legging.jpg
                  options:
                    pattern: true
                    colour: true
              full_optional:
                summary: Print + optional catalog classifiers
                value:
                  images:
                    - url: https://cdn.example.com/legging.jpg
                  options:
                    pattern: true
                    colour: true
                    subjects: true
                    product-type: true
      responses:
        "200":
          description: At least one image scored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
              examples:
                success:
                  summary: One image scored
                  value:
                    results:
                      - image_index: 0
                        url: https://cdn.example.com/garment.jpg
                        scores:
                          pattern:
                            - value: Plain
                              score: 0.71
                              gap: 0.08
                              p: 0.62
                            - value: Floral
                              score: 0.63
                              gap: 0.05
                              p: 0.28
                          colour:
                            - value: Black
                              score: 0.68
                              gap: 0.04
                              kind: solid
                            - value: Grey mix
                              score: 0.61
                              gap: 0.02
                              kind: mix
                          subjects:
                            - value: Safari
                              score: 0.42
                              gap: 0.01
                          product-type:
                            - value: Leggings
                              score: 0.55
                              gap: 0.03
                              p: 0.48
                              article: ""
                    errors: []
        "400":
          description: Invalid request body or unknown option key
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidRequestError"
                  - $ref: "#/components/schemas/UnknownOptionError"
              examples:
                invalid_request:
                  value:
                    error: invalid_request
                unknown_option:
                  value:
                    error: unknown_option
                    detail: "unsupported option keys: texture"
                    accepted:
                      - pattern-application
                      - pattern
                      - embellishment
                      - lustre
                      - appearance
                      - colour
                      - subjects
                      - product-type
                      - sleeve-length
                      - neckline
                      - trouser-length
                      - skirt-length
                      - dress-length
                      - shorts-style
        "422":
          description: All images failed to score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllImagesFailedError"
              examples:
                all_failed:
                  value:
                    error: all_images_failed
                    results: []
                    errors:
                      - image_index: 0
                        url: https://cdn.example.com/missing.jpg
                        error: image_unavailable
                        detail: http_404
  /v1/score-batch:
    post:
      summary: Score a bounded batch of product images against shared options
      description: |
        Score up to 16 product items in one request. Each item has a caller
        `key` and 1–2 image URLs. `options` are shared and follow the same
        rules as `/v1/score`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchScoreRequest"
      responses:
        "200":
          description: At least one image scored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchScoreResponse"
        "400":
          description: Invalid request body or unknown option key
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidRequestError"
                  - $ref: "#/components/schemas/UnknownOptionError"
        "422":
          description: All images failed to score
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    WarmupRequest:
      type: object
      required: [warmup]
      properties:
        warmup:
          type: boolean
          enum: [true]
    ScoreRequest:
      type: object
      required: [images, options]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
                description: Public `http` or `https` product image URL.
        options:
          $ref: "#/components/schemas/ScoreOptions"
    ScoreOptions:
      type: object
      description: |
        Boolean flags for each classifier slug. Missing keys are treated as
        `false`. At least one `true` is required.

        See `docs/api.md` for full behaviour.

        **Print (inventory today):** `appearance` (combined pattern-application,
        pattern, embellishment, and lustre) or those facets individually.

        **Embellishment:** `embellishment` — warehouse embellishment techniques.

        **Lustre:** `lustre` — optical fabric lustre or light effect (glitter,
        matte, iridescent, etc.).

        **Colour:** `colour` / `color` — model opinion. Returns solids,
        hue-anchored mixes, and one 3-colour combination.

        **Subjects:** `subjects` — graphic-theme catalog.

        **Product type:** `product-type` / `product_type` — 141 garment types.

        **Style:** `sleeve-length`, `neckline`, `trouser-length`,
        `skirt-length`, `dress-length`, and `shorts-style`.
      properties:
        pattern-application:
          type: boolean
        pattern:
          type: boolean
        embellishment:
          type: boolean
        lustre:
          type: boolean
        appearance:
          type: boolean
        colour:
          type: boolean
        color:
          type: boolean
        subjects:
          type: boolean
        product-type:
          type: boolean
        product_type:
          type: boolean
        sleeve-length:
          type: boolean
        neckline:
          type: boolean
        trouser-length:
          type: boolean
        skirt-length:
          type: boolean
        dress-length:
          type: boolean
        shorts-style:
          type: boolean
      additionalProperties: false
      example:
        pattern-application: true
        pattern: true
        colour: true
        subjects: true
        product-type: true
    BatchScoreRequest:
      type: object
      required: [items, options]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/BatchScoreItem"
        options:
          $ref: "#/components/schemas/ScoreOptions"
    BatchScoreItem:
      type: object
      required: [key, images]
      properties:
        key:
          type: string
        images:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [url]
            properties:
              url:
                type: string
                format: uri
    BatchScoreResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              results:
                type: array
                items:
                  $ref: "#/components/schemas/ImageResult"
              errors:
                type: array
                items:
                  $ref: "#/components/schemas/ImageError"
    LabelScore:
      type: object
      required: [value, score, gap]
      properties:
        value:
          type: string
          description: Label name (pool label, colour name, subject, or garment type).
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Mapped cosine in [0, 1]. Inventory thresholds apply to this field.
        gap:
          type: number
          minimum: 0
          description: |
            Mapped-cosine drop to the next label in the full ranked list.
            Zero on the last label.
        p:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Within-pool softmax. Present on exclusive pools (`appearance`,
            `pattern`, `pattern-application`, `embellishment`, `lustre`,
            `product-type`, and style pools). Absent on `colour` and `subjects`.
        kind:
          type: string
          description: Colour rows only.
          enum: [solid, mix, combination]
        article:
          type: string
          description: |
            Product-type rows only. `"a"`, `"an"`, or `""` (bare plural / mass
            noun). Use for copy: "a dress" vs "trousers".
    ColourLabelScore:
      allOf:
        - $ref: "#/components/schemas/LabelScore"
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [solid, mix, combination]
    ImageResult:
      type: object
      required: [image_index, url, scores]
      properties:
        image_index:
          type: integer
        url:
          type: string
        scores:
          type: object
          description: Keys match enabled option slugs only.
          additionalProperties:
            type: array
            items:
              oneOf:
                - $ref: "#/components/schemas/LabelScore"
                - $ref: "#/components/schemas/ColourLabelScore"
    ImageError:
      type: object
      required: [image_index, url, error, detail]
      properties:
        image_index:
          type: integer
        url:
          type: string
        error:
          type: string
          enum: [image_unavailable, scoring_failed]
        detail:
          type: string
    ScoreResponse:
      type: object
      required: [results, errors]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ImageResult"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImageError"
    InvalidRequestError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request]
    UnknownOptionError:
      type: object
      required: [error, detail, accepted]
      properties:
        error:
          type: string
          enum: [unknown_option]
        detail:
          type: string
        accepted:
          type: array
          items:
            type: string
    AllImagesFailedError:
      type: object
      required: [error, results, errors]
      properties:
        error:
          type: string
          enum: [all_images_failed]
        results:
          type: array
          maxItems: 0
          items: {}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImageError"
