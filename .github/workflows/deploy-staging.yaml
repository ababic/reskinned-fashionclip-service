name: Deploy staging image

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker build --platform linux/arm64 \
            --build-arg HF_TOKEN="$HF_TOKEN" \
            -t 830566885523.dkr.ecr.eu-west-1.amazonaws.com/reskinned-fashionclip-service-staging:latest .
          docker push 830566885523.dkr.ecr.eu-west-1.amazonaws.com/reskinned-fashionclip-service-staging:latest
      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name reskinned-fashionclip-service-staging \
            --image-uri 830566885523.dkr.ecr.eu-west-1.amazonaws.com/reskinned-fashionclip-service-staging:latest \
            --region eu-west-1
