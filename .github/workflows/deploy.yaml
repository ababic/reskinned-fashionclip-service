name: Deploy

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: "830566885523"
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      ECR_REPOSITORY: reskinned-fashionclip-service-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      LAMBDA_FUNCTION: reskinned-fashionclip-service-${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy role ARN
        id: deploy-role
        env:
          ROLE_FROM_SECRET: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ROLE_FROM_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          ROLE="${ROLE_FROM_SECRET:-$ROLE_FROM_VAR}"
          ROLE="$(printf '%s' "$ROLE" | tr -d '[:space:]')"
          if [ -z "$ROLE" ]; then
            echo "::error::Set repository secret AWS_DEPLOY_ROLE_ARN to the terraform/ci role ARN."
            exit 1
          fi
          case "$ROLE" in
            arn:aws:iam::*:role/*) ;;
            *)
              echo "::error::AWS_DEPLOY_ROLE_ARN must be a full IAM role ARN (length ${#ROLE})."
              exit 1
              ;;
          esac
          echo "role_arn=$ROLE" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy role ARN (length ${#ROLE})."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.deploy-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        run: |
          docker build --platform linux/arm64 \
            --build-arg HF_TOKEN="$HF_TOKEN" \
            -t "$IMAGE_URI" \
            .
          docker push "$IMAGE_URI"

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"

      - name: Tag Lambda with Sentry release
        env:
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          VARS=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'Environment.Variables' \
            --output json | jq --arg rel "$SENTRY_RELEASE" '. + {SENTRY_RELEASE: $rel}')
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "$(jq -n --argjson vars "$VARS" '{Variables: $vars}')" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          echo "Set SENTRY_RELEASE=$SENTRY_RELEASE"

      - name: Smoke test /v1/score
        env:
          PRINT_VISION_URL: ${{ vars.PRINT_VISION_URL }}
          PRINT_VISION_API_KEY: ${{ secrets.PRINT_VISION_API_KEY }}
        run: |
          if [ -z "$PRINT_VISION_URL" ] || [ -z "$PRINT_VISION_API_KEY" ]; then
            echo "Skipping smoke test — set environment vars PRINT_VISION_URL and secret PRINT_VISION_API_KEY."
            exit 0
          fi
          payload='{"images":[{"url":"https://cdn.shopify.com/s/files/1/0081/8711/7664/files/Dayflex_leggingpantnofrontseam_shadowblack_10189.jpg?v=1744812821"}],"pools":{"pattern-application":["Placement print","All-over print"],"pattern":["Floral","Striped"]},"top_k":3}'
          for attempt in 1 2 3; do
            http_code=$(curl -sS -o /tmp/smoke-body.json -w "%{http_code}" --max-time 120 \
              -X POST "$PRINT_VISION_URL" \
              -H "content-type: application/json" \
              -H "x-api-key: $PRINT_VISION_API_KEY" \
              -d "$payload" || echo "000")
            if [ "$http_code" = "200" ]; then
              python3 -c "import json; d=json.load(open('/tmp/smoke-body.json')); assert d.get('results'), d; print('smoke ok:', d['results'][0]['scores'].keys())"
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && echo "$http_code" | grep -qE '502|503|504'; then
              echo "Attempt $attempt got HTTP $http_code (likely cold start); retrying in 45s..."
              sleep 45
              continue
            fi
            echo "Smoke test failed with HTTP $http_code"
            cat /tmp/smoke-body.json
            exit 1
          done
