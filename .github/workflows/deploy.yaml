name: Deploy

on:
  push:
    branches:
      - main
      - staging
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: "830566885523"
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      ECR_REPOSITORY: reskinned-fashionclip-service-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      LAMBDA_FUNCTION: reskinned-fashionclip-service-${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve deploy role ARN
        id: deploy-role
        env:
          ROLE_FROM_SECRET: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ROLE_FROM_VAR: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          ROLE="${ROLE_FROM_SECRET:-$ROLE_FROM_VAR}"
          ROLE="$(printf '%s' "$ROLE" | tr -d '[:space:]')"
          if [ -z "$ROLE" ]; then
            echo "::error::Set repository secret AWS_DEPLOY_ROLE_ARN to the terraform/ci role ARN."
            exit 1
          fi
          case "$ROLE" in
            arn:aws:iam::*:role/*) ;;
            *)
              echo "::error::AWS_DEPLOY_ROLE_ARN must be a full IAM role ARN (length ${#ROLE})."
              exit 1
              ;;
          esac
          echo "role_arn=$ROLE" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy role ARN (length ${#ROLE})."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.deploy-role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=registry,ref=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:buildcache,mode=max

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"

      - name: Tag Lambda with Sentry release
        env:
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          VARS=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'Environment.Variables' \
            --output json | jq --arg rel "$SENTRY_RELEASE" '. + {SENTRY_RELEASE: $rel}')
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "$(jq -n --argjson vars "$VARS" '{Variables: $vars}')" \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"
          echo "Set SENTRY_RELEASE=$SENTRY_RELEASE"

      - name: Smoke test /v1/score
        env:
          PRINT_VISION_URL: ${{ vars.PRINT_VISION_URL }}
          PRINT_VISION_API_KEY: ${{ secrets.PRINT_VISION_API_KEY }}
        run: |
          if [ -z "$PRINT_VISION_URL" ] || [ -z "$PRINT_VISION_API_KEY" ]; then
            echo "Skipping smoke test — set environment vars PRINT_VISION_URL and secret PRINT_VISION_API_KEY."
            exit 0
          fi
          python3 - <<'PY'
          import json

          payload = {
              "images": [
                  {
                      "url": "https://cdn.shopify.com/s/files/1/0081/8711/7664/files/Dayflex_leggingpantnofrontseam_shadowblack_10189.jpg?v=1744812821",
                  }
              ],
              "options": {
                  "pattern-application": true,
                  "pattern": true,
              },
          }
          json.dump(
              {
                  "httpMethod": "POST",
                  "path": "/v1/score",
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps(payload),
              },
              open("/tmp/smoke-event.json", "w"),
          )
          json.dump(payload, open("/tmp/smoke-payload.json", "w"))
          PY
          echo "Warming Lambda via direct invoke (cold start can take ~60–90s)..."
          aws lambda invoke \
            --cli-binary-format raw-in-base64-out \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --payload file:///tmp/smoke-event.json \
            /tmp/lambda-response.json >/tmp/lambda-invoke-meta.json
          python3 - <<'PY'
          import json
          import sys

          raw = json.load(open("/tmp/lambda-response.json"))
          if "errorMessage" in raw:
              print("Lambda invoke failed:", raw, file=sys.stderr)
              sys.exit(1)
          status = raw.get("statusCode")
          if status != 200:
              print("Unexpected statusCode:", raw, file=sys.stderr)
              sys.exit(1)
          body = json.loads(raw["body"])
          if not body.get("results"):
              print("No results in warm invoke:", body, file=sys.stderr)
              sys.exit(1)
          print("warm invoke ok:", body["results"][0]["scores"].keys())
          PY
          echo "Checking API Gateway (warm container)..."
          http_code=$(curl -sS -o /tmp/smoke-body.json -w "%{http_code}" --max-time 30 \
            -X POST "$PRINT_VISION_URL" \
            -H "content-type: application/json" \
            -H "x-api-key: $PRINT_VISION_API_KEY" \
            -d @/tmp/smoke-payload.json || echo "000")
          if [ "$http_code" != "200" ]; then
            echo "API Gateway smoke test failed with HTTP $http_code"
            cat /tmp/smoke-body.json
            exit 1
          fi
          python3 -c "import json; d=json.load(open('/tmp/smoke-body.json')); assert d.get('results'), d; print('api smoke ok:', d['results'][0]['scores'].keys())"
