[project]
name = "reskinned-fashionclip-service"
version = "0.1.0"
description = "Lambda FashionCLIP scorer for Reskinned"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "sentry-sdk>=2.0.0",
    "torch==2.5.1",
    "transformers>=4.44.0,<5.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
